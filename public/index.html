
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>الذكاء العربي الخارق</title>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:white}
header{padding:22px;text-align:center;background:#17243a;border-bottom:1px solid #34445e}
header h1{margin:0 0 8px;color:#65d6c4}
header p{margin:0;color:#c6d1df}
main{max-width:850px;margin:25px auto;padding:15px}
.panel{background:#1a2940;border:1px solid #34445e;border-radius:16px;padding:18px}
label{display:block;margin-bottom:8px;color:#65d6c4}
#chat{height:480px;overflow-y:auto;padding:12px;background:#101827;border-radius:12px;margin-bottom:15px}
.message{padding:13px;margin:9px 0;border-radius:12px;line-height:1.9;overflow-wrap:anywhere}
.user{background:#245b69;white-space:pre-wrap}
.bot{background:#293b55;min-width:0}
.bot-row{display:flex;align-items:flex-start;gap:10px;margin:15px 0}
.bot-avatar{width:48px;height:48px;flex:0 0 48px;object-fit:cover;border-radius:14px;border:2px solid #65d6c4}
.bot-content{flex:1;min-width:0}
.copy-bar{display:flex;justify-content:flex-end;margin-bottom:5px}
.copy-btn{background:#344b65;color:white;padding:7px 12px;font-size:13px;border:1px solid #536780}
.copy-btn:hover{background:#42617f}
.message.bot h1,.message.bot h2,.message.bot h3,.message.bot h4{color:#65d6c4;line-height:1.5}
.message.bot p{margin:10px 0}
.message.bot ul,.message.bot ol{padding-inline-start:25px}
.message.bot li{margin:5px 0}
.message.bot blockquote{border-inline-start:3px solid #65d6c4;margin:12px 0;padding:8px 14px;background:#203149}
.message.bot table{width:100%;border-collapse:collapse;margin:14px 0;display:block;overflow-x:auto}
.message.bot th,.message.bot td{border:1px solid #536780;padding:9px;text-align:start;min-width:90px}
.message.bot th{background:#344b65;color:#65d6c4}
.message.bot pre{background:#101827;padding:12px;border-radius:9px;overflow-x:auto;direction:ltr;text-align:left}
.message.bot code{background:#101827;padding:3px 5px;border-radius:4px}
.message.bot pre code{padding:0}
.message.bot a{color:#65d6c4;overflow-wrap:anywhere}
textarea,select{width:100%;padding:13px;border-radius:10px;border:1px solid #536780;background:#101827;color:white;font-size:16px;margin-bottom:10px}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:10px;padding:13px 20px;background:#45c7b2;color:#09202a;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#send{width:100%}
footer{text-align:center;color:#9eacc0;padding:25px;font-size:13px}
@media(max-width:600px){
header{padding:18px 10px}
main{margin:10px auto;padding:10px}
.panel{padding:12px}
#chat{height:430px}
.bot-avatar{width:40px;height:40px;flex-basis:40px}
.message{padding:10px;font-size:14px}
}
</style>
</head>

<body>
<header>
<h1>الذكاء العربي الخارق</h1>
<p id="subtitle">مساعدك الذكي باللغة التي تحبها</p>
</header>

<main>
<div class="panel">

<label id="languageLabel" for="language">اختر اللغة</label>

<select id="language">
<option value="ar">العربية</option>
<option value="en">English</option>
<option value="tr">Türkçe</option>
</select>

<div id="chat" aria-live="polite">
<div class="bot-row">
<img class="bot-avatar" src="./file_00000000eb688210be5b1ca9eaa5ef6d.png" alt="صورة المساعد">
<div class="bot-content">
<div class="message bot" id="welcome">
أهلاً بك! أنا مساعد الذكاء العربي الخارق.
كيف يمكنني مساعدتك اليوم؟
</div>
</div>
</div>
</div>

<textarea id="message" placeholder="اكتب سؤالك هنا..."></textarea>
<button id="send">إرسال</button>

</div>
</main>

<footer>© 2026 الذكاء العربي الخارق</footer>

<script>
const translations = {
ar: {
subtitle:"مساعدك الذكي باللغة التي تحبها",
language:"اختر اللغة",
placeholder:"اكتب سؤالك هنا...",
send:"إرسال",
thinking:"جاري التفكير...",
error:"الخادم غير متصل حالياً. حاول مرة أخرى.",
copy:"نسخ الإجابة",
copied:"تم النسخ!",
failed:"تعذر النسخ",
welcome:"أهلاً بك! أنا مساعد الذكاء العربي الخارق. كيف يمكنني مساعدتك اليوم؟"
},
en: {
subtitle:"Your intelligent assistant in your preferred language",
language:"Choose language",
placeholder:"Type your question here...",
send:"Send",
thinking:"Thinking...",
error:"The server is currently unavailable. Please try again.",
copy:"Copy answer",
copied:"Copied!",
failed:"Copy failed",
welcome:"Welcome! I am Super Arabic Intelligence. How can I help you today?"
},
tr: {
subtitle:"Tercih ettiğiniz dilde akıllı asistanınız",
language:"Dil seçin",
placeholder:"Sorunuzu buraya yazın...",
send:"Gönder",
thinking:"Düşünüyor...",
error:"Sunucu şu anda bağlı değil. Tekrar deneyin.",
copy:"Yanıtı kopyala",
copied:"Kopyalandı!",
failed:"Kopyalama başarısız",
welcome:"Hoş geldiniz! Ben Süper Arap Yapay Zekâ Asistanıyım. Size nasıl yardımcı olabilirim?"
}
};

const input=document.getElementById("message");
const chat=document.getElementById("chat");
const button=document.getElementById("send");
const languageSelect=document.getElementById("language");

function getLanguage(){
return translations[languageSelect.value] || translations.ar;
}

function updateLanguage(){
const lang=languageSelect.value;
const t=getLanguage();

document.documentElement.lang=lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";

document.getElementById("subtitle").textContent=t.subtitle;
document.getElementById("languageLabel").textContent=t.language;
input.placeholder=t.placeholder;
button.textContent=t.send;

const welcome=document.getElementById("welcome");
if(welcome) welcome.textContent=t.welcome;
}

languageSelect.addEventListener("change",updateLanguage);

function renderMarkdown(text){
if(!window.marked || !window.DOMPurify){
const fallback=document.createElement("span");
fallback.textContent=text;
return fallback;
}

const html=marked.parse(text,{breaks:true,gfm:true});
const clean=DOMPurify.sanitize(html,{USE_PROFILES:{html:true}});
const template=document.createElement("template");
template.innerHTML=clean;

template.content.querySelectorAll("a").forEach(link=>{
link.setAttribute("target","_blank");
link.setAttribute("rel","noopener noreferrer");
});

return template.content;
}

async function copyText(text,buttonElement){
const t=getLanguage();

try{
if(navigator.clipboard && window.isSecureContext){
await navigator.clipboard.writeText(text);
}else{
const area=document.createElement("textarea");
area.value=text;
area.style.position="fixed";
area.style.opacity="0";
document.body.appendChild(area);
area.select();
const success=document.execCommand("copy");
area.remove();
if(!success) throw new Error("Copy failed");
}

buttonElement.textContent="✓ "+t.copied;
}catch(error){
buttonElement.textContent=t.failed;
}

setTimeout(()=>{
buttonElement.textContent="▢ "+getLanguage().copy;
},2000);
}

function addBotMessage(text){
const row=document.createElement("div");
row.className="bot-row";

const avatar=document.createElement("img");
avatar.className="bot-avatar";
avatar.src="./file_00000000eb688210be5b1ca9eaa5ef6d.png";
avatar.alt="صورة المساعد";

const content=document.createElement("div");
content.className="bot-content";

const copyBar=document.createElement("div");
copyBar.className="copy-bar";

const copyButton=document.createElement("button");
copyButton.className="copy-btn";
copyButton.type="button";
copyButton.textContent="▢ "+getLanguage().copy;

const answer=document.createElement("div");
answer.className="message bot";
answer.appendChild(renderMarkdown(text));

copyButton.addEventListener("click",()=>{
copyText(text,copyButton);
});

copyBar.appendChild(copyButton);
content.appendChild(copyBar);
content.appendChild(answer);
row.appendChild(avatar);
row.appendChild(content);
chat.appendChild(row);

return {answer,copyButton};
}

async function sendMessage(){
const message=input.value.trim();
const t=getLanguage();

if(!message || button.disabled) return;

const user=document.createElement("div");
user.className="message user";
user.textContent=message;
chat.appendChild(user);

input.value="";
button.disabled=true;
input.disabled=true;

const bot=addBotMessage(t.thinking);
chat.scrollTop=chat.scrollHeight;

try{
const response=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
message:message,
language:languageSelect.value
})
});

let data;
try{
data=await response.json();
}catch(parseError){
throw new Error(t.error);
}

if(!response.ok){
throw new Error(data.error || t.error);
}

const reply=typeof data.reply==="string" && data.reply.trim()
? data.reply.trim()
: t.error;

bot.answer.replaceChildren(renderMarkdown(reply));
bot.copyButton.onclick=()=>copyText(reply,bot.copyButton);

}catch(error){
bot.answer.textContent=error.message || t.error;
}

button.disabled=false;
input.disabled=false;
input.focus();
chat.scrollTop=chat.scrollHeight;
}

button.addEventListener("click",sendMessage);

input.addEventListener("keydown",event=>{
if(event.key==="Enter" && !event.shiftKey){
event.preventDefault();
sendMessage();
}
});

updateLanguage();
</script>
</body>
</html>
