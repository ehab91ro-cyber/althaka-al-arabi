
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>الذكاء العربي الخارق</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    header {
      padding: 22px;
      text-align: center;
      background: #17243a;
      border-bottom: 1px solid #34445e;
    }

    header h1 {
      margin: 0 0 8px;
      color: #65d6c4;
    }

    header p {
      margin: 0;
      color: #c6d1df;
    }

    main {
      max-width: 760px;
      margin: 25px auto;
      padding: 15px;
    }

    .panel {
      background: #1a2940;
      border: 1px solid #34445e;
      border-radius: 16px;
      padding: 18px;
    }

    #chat {
      height: 360px;
      overflow-y: auto;
      padding: 12px;
      background: #101827;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px;
      margin: 9px 0;
      border-radius: 12px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user { background: #245b69; }
    .bot { background: #293b55; }

    .bot-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 12px 0;
    }

    .bot-avatar {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid #65d6c4;
    }

    .bot-row .message.bot {
      flex: 1;
      min-width: 0;
      margin: 0;
    }

    textarea, select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #536780;
      background: #101827;
      color: white;
      font-size: 16px;
      margin-bottom: 10px;
    }

    textarea {
      min-height: 75px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      background: #45c7b2;
      color: #09202a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .5; }

    footer {
      text-align: center;
      color: #9eacc0;
      padding: 25px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>الذكاء العربي الخارق</h1>
    <p>مساعدك الذكي باللغة التي تحبها</p>
  </header>

  <main>
    <div class="panel">

      <label for="language">اختر اللغة</label>

      <select id="language">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
      </select>

      <div id="chat" aria-live="polite">
        <div class="bot-row">
          <img
            class="bot-avatar"
            src="./file_00000000eb688210be5b1ca9eaa5ef6d.png"
            alt="صورة المساعد"
          >

          <div class="message bot">
            أهلاً بك! أنا مساعد الذكاء العربي الخارق.
            كيف يمكنني مساعدتك اليوم؟
          </div>
        </div>
      </div>

      <textarea
        id="message"
        placeholder="اكتب سؤالك هنا..."
      ></textarea>

      <button id="send" onclick="sendMessage()">
        إرسال
      </button>

    </div>
  </main>

  <footer>
    © 2026 الذكاء العربي الخارق
  </footer>

  <script>
    async function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");
      const button = document.getElementById("send");

      const message = input.value.trim();

      if (!message) return;

      const user = document.createElement("div");
      user.className = "message user";
      user.textContent = message;
      chat.appendChild(user);

      input.value = "";
      button.disabled = true;

      const botRow = document.createElement("div");
      botRow.className = "bot-row";

      const avatar = document.createElement("img");
      avatar.className = "bot-avatar";
      avatar.src = "./file_00000000eb688210be5b1ca9eaa5ef6d.png";
      avatar.alt = "صورة المساعد";

      const loading = document.createElement("div");
      loading.className = "message bot";
      loading.textContent = "جاري التفكير...";

      botRow.appendChild(avatar);
      botRow.appendChild(loading);
      chat.appendChild(botRow);

      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        loading.textContent =
          data.reply || data.error || "لم يصل رد.";

      } catch (error) {
        loading.textContent =
          "الخادم غير متصل حالياً. حاول مرة أخرى.";
      }

      button.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
